$('fab').onclick=()=>window.scrollTo({top:scrollY<$('side').offsetHeight/2?$('main').offsetTop:0,behavior:'smooth'});
$('camp').onchange=e=>{S.cur=e.target.value;C=S.camps[S.cur];ui();save()};
$('cNew').onclick=()=>{const n=prompt('Campaign name?');if(!n)return;const k='c'+Date.now();S.camps[k]=norm(blank(n));S.cur=k;C=S.camps[k];ui();save()};
$('cRen').onclick=()=>{const n=prompt('Rename campaign',C.name);if(n){C.name=n;ui();save()}};
$('cDel').onclick=()=>{if(!confirm(`Delete “${C.name}” and all its scenes? Export a backup first if unsure.`))return;delete S.camps[S.cur];if(!Object.keys(S.camps).length)S.camps.c1=norm(blank('Campaign 1'));S.cur=Object.keys(S.camps)[0];C=S.camps[S.cur];ui();save()};
$('exp').onclick=()=>{const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(S,null,1)],{type:'application/json'}));a.download='trey_campaigns_'+new Date().toISOString().slice(0,10)+'.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1500)};
$('impB').onclick=()=>$('imp').click();
$('imp').onchange=e=>{const f=e.target.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{try{const o=JSON.parse(r.result);if(o&&o.camps&&typeof o.camps=='object'&&Object.keys(o.camps).length){if(!confirm('Replace ALL campaigns with the imported file?'))return;S=o}else if(o&&(Array.isArray(o.scenes)||'currentST' in o)){const k='c'+Date.now();S.camps[k]=fromLegacy(o);S.camps[k].name='Imported '+new Date().toLocaleDateString();S.cur=k}else throw 0;for(const k in S.camps)S.camps[k]=norm(S.camps[k]);if(!S.camps[S.cur])S.cur=Object.keys(S.camps)[0];C=S.camps[S.cur];ui();tab(S.tab);save();toast('Imported.')}catch(x){toast('Import failed: that is not a TREY dashboard file.')}};r.readAsText(f);e.target.value=''};
load();thm();ui();tab(S.tab);
// PWA: offline support + ask the browser not to evict saved campaigns
if('serviceWorker' in navigator&&location.protocol.startsWith('http'))navigator.serviceWorker.register('sw.js').catch(()=>{});
if(navigator.storage&&navigator.storage.persist)navigator.storage.persist().catch(()=>{});
</script></body></html>
